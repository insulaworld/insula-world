# Fly.io settings for Insula World. One always-on machine with a 1 GB disk for the save file.
app = "insula-world"
primary_region = "iad"

[env]
  PORT = "8080"
  INSULA_SAVE = "/data/world.json"
  # ERC-8004: each animal registers itself once as an on-chain AI agent (gas paid by the bank).
  ERC8004 = "on"
  # ERC-8004 reputation: the animals rate each other on-chain after their deals (one rating per pair per day).
  ERC8004_REPUTATION = "on"
  # Once: the animals also rate everything they did together since day 1 (runs a single time, then never again).
  ERC8004_REPUTATION_HISTORY = "on"
  # Insula's own ERC-8004 agent (owned by the dev wallet; asks Hey Research to validate what Insula ships).
  ERC8004_PROJECT_AGENT_ID = "25434"

[[mounts]]
  source = "insula_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The island never sleeps: keep the machine running even with no visitors.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
