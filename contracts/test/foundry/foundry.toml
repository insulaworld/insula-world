# Stateful fuzzing of IslandBonds with Foundry. From this folder:
#   git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
#   forge test --mt invariant
# Permit2 is deployed from permit2.json (Uniswap's Permit2, prebuilt), since it pins an older compiler.
[profile.default]
src = "test"
test = "test"
libs = ["lib"]
allow_paths = ["../.."]
remappings = ["forge-std/=lib/forge-std/src/", "bonds/=../../"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
fs_permissions = [{ access = "read-write", path = "." }]

[invariant]
runs = 2000
depth = 200
fail_on_revert = true
